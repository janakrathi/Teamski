<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <radialGradient id="glow" cx="0.25" cy="0.35" r="0.7">
    <stop offset="0" stop-color="#2a1f17"/>
    <stop offset="1" stop-color="#0a0a09"/>
  </radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
  </pattern>
</defs>
<rect width="1280" height="640" rx="24" fill="url(#glow)"/>
<rect width="1280" height="640" rx="24" fill="url(#dots)"/>

<image href="data:image/png;base64," x="64" y="72" width="64" height="64"/>
<text x="144" y="118" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-1">Teamski</text>

<text x="64" y="222" font-size="50" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Shared AI agents</text>
<text x="64" y="282" font-size="50" font-weight="800" fill="#ffffff" letter-spacing="-1.5">for teams.</text>

<text x="64" y="338" font-size="19" fill="#a8a49e">One agent per channel. Your whole team talks to it.</text>
<text x="64" y="366" font-size="19" fill="#a8a49e">It remembers the project, uses your apps, works in</text>
<text x="64" y="394" font-size="19" fill="#a8a49e">the background - and asks before changing anything.</text>

<rect x="64" y="428" width="186" height="34" rx="17" fill="#1a1a17" stroke="#3a3a33"/><text x="157.0" y="450" font-size="14" font-weight="600" fill="#ece9e4" text-anchor="middle">Open source · AGPL</text>
<rect x="260" y="428" width="140" height="34" rx="17" fill="#1a1a17" stroke="#3a3a33"/><text x="330.0" y="450" font-size="14" font-weight="600" fill="#ece9e4" text-anchor="middle">Self-hostable</text>
<rect x="410" y="428" width="103" height="34" rx="17" fill="#1a1a17" stroke="#3a3a33"/><text x="461.5" y="450" font-size="14" font-weight="600" fill="#ece9e4" text-anchor="middle">Any model</text>
<rect x="64" y="472" width="204" height="34" rx="17" fill="#2a1a12" stroke="#7a3e28"/><text x="166.0" y="494" font-size="14" font-weight="600" fill="#f0a383" text-anchor="middle">New: Windows · Mac app</text>
<rect x="278" y="472" width="128" height="34" rx="17" fill="#2a1a12" stroke="#7a3e28"/><text x="342.0" y="494" font-size="14" font-weight="600" fill="#f0a383" text-anchor="middle">Coding agent</text>
<rect x="416" y="472" width="94" height="34" rx="17" fill="#1a1a17" stroke="#3a3a33"/><text x="463.0" y="494" font-size="14" font-weight="600" fill="#ece9e4" text-anchor="middle">MCP apps</text>
<text x="64" y="560" font-size="17" font-weight="600" fill="#ffffff">teamski.in</text>
<text x="160" y="560" font-size="17" fill="#7a7671">· free to start, or run it yourself</text>
<rect x="636" y="56" width="604" height="528" rx="18" fill="#121210" stroke="#2c2c27"/>
<circle cx="662" cy="84" r="5" fill="#3a3a34"/><circle cx="680" cy="84" r="5" fill="#3a3a34"/><circle cx="698" cy="84" r="5" fill="#3a3a34"/>
<text x="724" y="90" font-size="16" font-weight="700" fill="#ffffff"># launch</text>
<text x="1216" y="90" font-size="13" fill="#807c76" text-anchor="end">3 people · 1 agent</text>
<line x1="636" y1="108" x2="1240" y2="108" stroke="#23231f"/>
<circle cx="690" cy="142" r="15" fill="#f9a8d4"/><text x="690" y="147" font-size="14" font-weight="700" fill="#0a0a09" text-anchor="middle">A</text>
<text x="718" y="146" font-size="15" font-weight="700" fill="#f2efea">Asha</text>
<text x="718" y="170" font-size="15" fill="#cbc7c0">Remember for the whole project: demo is Friday,</text>
<text x="718" y="192" font-size="15" fill="#cbc7c0">and we're building on Next.js + Supabase.</text>
<circle cx="690" cy="228" r="15" fill="#93c5fd"/><text x="690" y="233" font-size="14" font-weight="700" fill="#0a0a09" text-anchor="middle">R</text>
<text x="718" y="232" font-size="15" font-weight="700" fill="#f2efea">Rohan</text>
<text x="718" y="256" font-size="15" fill="#cbc7c0">@agent research three competitors and draft</text>
<text x="718" y="278" font-size="15" fill="#cbc7c0">a comparison table for the pitch.</text>
<rect x="660" y="298" width="560" height="112" rx="12" fill="#181815" stroke="#2e2e29"/>
<image href="data:image/png;base64," x="676" y="306" width="28" height="28"/>
<text x="718" y="324" font-size="15" font-weight="700" fill="#f2efea">Teamski agent</text>
<text x="718" y="348" font-size="15" fill="#cbc7c0">Saved to project memory - every channel knows it.</text>
<text x="718" y="370" font-size="15" fill="#cbc7c0">Researching in the background; I'll post here</text>
<text x="718" y="392" font-size="15" fill="#cbc7c0">when the table is ready.</text>
<rect x="660" y="430" width="560" height="128" rx="12" fill="#17130f" stroke="#7a3e28" stroke-dasharray="5 4"/>
<text x="680" y="460" font-size="13" font-weight="700" fill="#e08a66" letter-spacing="1">NEEDS APPROVAL</text>
<text x="680" y="488" font-size="15" fill="#ece9e4">Create a GitHub issue: "Fix sign-in redirect on Safari"</text>
<rect x="680" y="508" width="96" height="32" rx="8" fill="#c96442"/><text x="728" y="529" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Approve</text>
<rect x="786" y="508" width="80" height="32" rx="8" fill="none" stroke="#46463f"/><text x="826" y="529" font-size="14" font-weight="600" fill="#cbc7c0" text-anchor="middle">Deny</text>
</svg>