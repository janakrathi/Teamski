<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <radialGradient id="glow" cx="0.25" cy="0.35" r="0.7">
    <stop offset="0" stop-color="#2a2a40"/>
    <stop offset="1" stop-color="#0b0b0f"/>
  </radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
  </pattern>
</defs>
<rect width="1280" height="640" rx="24" fill="url(#glow)"/>
<rect width="1280" height="640" rx="24" fill="url(#dots)"/>

<image href="data:image/png;base64," x="64" y="72" width="64" height="64"/>
<text x="144" y="118" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-1">Teamski</text>

<text x="64" y="222" font-size="50" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Shared AI agents</text>
<text x="64" y="282" font-size="50" font-weight="800" fill="#ffffff" letter-spacing="-1.5">for teams.</text>

<text x="64" y="338" font-size="19" fill="#a9a9b8">One agent per channel. Your whole team talks to it.</text>
<text x="64" y="366" font-size="19" fill="#a9a9b8">It remembers the project, uses your apps, works in</text>
<text x="64" y="394" font-size="19" fill="#a9a9b8">the background - and asks before changing anything.</text>

<rect x="64" y="440" width="186" height="34" rx="17" fill="#1b1b26" stroke="#34344a"/><text x="157" y="462" font-size="14" font-weight="600" fill="#e6e6ee" text-anchor="middle">Open source · AGPL</text>
<rect x="259.6" y="440" width="140" height="34" rx="17" fill="#1b1b26" stroke="#34344a"/><text x="329" y="462" font-size="14" font-weight="600" fill="#e6e6ee" text-anchor="middle">Self-hostable</text>
<rect x="409.20000000000005" y="440" width="103" height="34" rx="17" fill="#1b1b26" stroke="#34344a"/><text x="461" y="462" font-size="14" font-weight="600" fill="#e6e6ee" text-anchor="middle">Any model</text>
<rect x="522.0" y="440" width="94" height="34" rx="17" fill="#1b1b26" stroke="#34344a"/><text x="569" y="462" font-size="14" font-weight="600" fill="#e6e6ee" text-anchor="middle">MCP apps</text>
<text x="64" y="548" font-size="17" font-weight="600" fill="#ffffff">teamski.in</text>
<text x="160" y="548" font-size="17" fill="#6d6d80">· free to start, or run it yourself</text>
<rect x="636" y="56" width="604" height="528" rx="18" fill="#101016" stroke="#2a2a38"/>
<circle cx="662" cy="84" r="5" fill="#3a3a4a"/><circle cx="680" cy="84" r="5" fill="#3a3a4a"/><circle cx="698" cy="84" r="5" fill="#3a3a4a"/>
<text x="724" y="90" font-size="16" font-weight="700" fill="#ffffff"># launch</text>
<text x="1216" y="90" font-size="13" fill="#7b7b90" text-anchor="end">3 people · 1 agent</text>
<line x1="636" y1="108" x2="1240" y2="108" stroke="#22222e"/>
<circle cx="690" cy="142" r="15" fill="#f9a8d4"/><text x="690" y="147" font-size="14" font-weight="700" fill="#0b0b0f" text-anchor="middle">A</text>
<text x="718" y="146" font-size="15" font-weight="700" fill="#f4f4f6">Asha</text>
<text x="718" y="170" font-size="15" fill="#c9c9d3">Remember for the whole project: demo is Friday,</text>
<text x="718" y="192" font-size="15" fill="#c9c9d3">and we're building on Next.js + Supabase.</text>
<circle cx="690" cy="228" r="15" fill="#93c5fd"/><text x="690" y="233" font-size="14" font-weight="700" fill="#0b0b0f" text-anchor="middle">R</text>
<text x="718" y="232" font-size="15" font-weight="700" fill="#f4f4f6">Rohan</text>
<text x="718" y="256" font-size="15" fill="#c9c9d3">@agent research three competitors and draft</text>
<text x="718" y="278" font-size="15" fill="#c9c9d3">a comparison table for the pitch.</text>
<rect x="660" y="298" width="560" height="112" rx="12" fill="#17171f" stroke="#2c2c3a"/>
<image href="data:image/png;base64," x="676" y="306" width="28" height="28"/>
<text x="718" y="324" font-size="15" font-weight="700" fill="#f4f4f6">Teamski agent</text>
<text x="718" y="348" font-size="15" fill="#c9c9d3">Saved to project memory - every channel knows it.</text>
<text x="718" y="370" font-size="15" fill="#c9c9d3">Researching in the background; I'll post here</text>
<text x="718" y="392" font-size="15" fill="#c9c9d3">when the table is ready.</text>
<rect x="660" y="430" width="560" height="128" rx="12" fill="#14141c" stroke="#3b3b55" stroke-dasharray="5 4"/>
<text x="680" y="460" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="1">NEEDS APPROVAL</text>
<text x="680" y="488" font-size="15" fill="#e6e6ee">Create a GitHub issue: "Fix sign-in redirect on Safari"</text>
<rect x="680" y="508" width="96" height="32" rx="8" fill="#ffffff"/><text x="728" y="529" font-size="14" font-weight="700" fill="#0b0b0f" text-anchor="middle">Approve</text>
<rect x="786" y="508" width="80" height="32" rx="8" fill="none" stroke="#44445a"/><text x="826" y="529" font-size="14" font-weight="600" fill="#c9c9d3" text-anchor="middle">Deny</text>
</svg>