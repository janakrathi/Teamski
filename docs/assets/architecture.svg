<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b8ba3"/></marker></defs>
<rect width="1280" height="600" rx="24" fill="#0b0b0f"/>
<text x="40" y="52" font-size="22" font-weight="800" fill="#ffffff">How Teamski fits together</text>
<rect x="40" y="100" width="250" height="150" rx="14" fill="#14141c" stroke="#2c2c3a" stroke-width="1.5"/>
<text x="60" y="134" font-size="18" font-weight="700" fill="#ffffff">Your team</text>
<text x="60" y="162" font-size="14" fill="#a9a9b8">Browser or phone</text>
<text x="60" y="184" font-size="14" fill="#a9a9b8">Channels, DMs, threads</text>
<text x="60" y="206" font-size="14" fill="#a9a9b8">Approve / deny actions</text>
<rect x="420" y="100" width="330" height="170" rx="14" fill="#14141c" stroke="#6366f1" stroke-width="1.5"/>
<text x="440" y="134" font-size="18" font-weight="700" fill="#ffffff">Next.js app</text>
<text x="440" y="162" font-size="14" fill="#a9a9b8">Chat API: streams replies</text>
<text x="440" y="184" font-size="14" fill="#a9a9b8">Memory, tools, approvals</text>
<text x="440" y="206" font-size="14" fill="#a9a9b8">Membership checked per route</text>
<text x="440" y="228" font-size="14" fill="#a9a9b8">Rate limits, error alerts</text>
<rect x="880" y="100" width="360" height="170" rx="14" fill="#14141c" stroke="#f59e0b" stroke-width="1.5"/>
<text x="900" y="134" font-size="18" font-weight="700" fill="#ffffff">Models and apps</text>
<text x="900" y="162" font-size="14" fill="#a9a9b8">Groq · Cerebras · Ollama · your keys</text>
<text x="900" y="184" font-size="14" fill="#a9a9b8">MCP: Notion, Linear, Jira, Canva…</text>
<text x="900" y="206" font-size="14" fill="#a9a9b8">GitHub · Google Sheets · the web</text>
<rect x="420" y="330" width="330" height="150" rx="14" fill="#14141c" stroke="#6366f1" stroke-width="1.5"/>
<text x="440" y="364" font-size="18" font-weight="700" fill="#ffffff">Worker (Node)</text>
<text x="440" y="392" font-size="14" fill="#a9a9b8">Background tasks + schedules</text>
<text x="440" y="414" font-size="14" fill="#a9a9b8">Pause / stop, retries</text>
<text x="440" y="436" font-size="14" fill="#a9a9b8">Calls models and tools too</text>
<rect x="880" y="330" width="360" height="150" rx="14" fill="#14141c" stroke="#22c55e" stroke-width="1.5"/>
<text x="900" y="364" font-size="18" font-weight="700" fill="#ffffff">Supabase</text>
<text x="900" y="392" font-size="14" fill="#a9a9b8">Postgres + row level security</text>
<text x="900" y="414" font-size="14" fill="#a9a9b8">pgvector memory (encrypted)</text>
<text x="900" y="436" font-size="14" fill="#a9a9b8">Realtime · Storage · Auth</text>
<path d="M290 175 L420 175" fill="none" stroke="#8b8ba3" stroke-width="1.6" marker-end="url(#a)"/>
<text x="355" y="165" font-size="13" fill="#c9c9d3" text-anchor="middle">HTTP + streaming</text>
<path d="M750 175 L880 175" fill="none" stroke="#8b8ba3" stroke-width="1.6" marker-end="url(#a)"/>
<text x="815" y="165" font-size="13" fill="#c9c9d3" text-anchor="middle">model calls, tools</text>
<path d="M750 405 L880 405" fill="none" stroke="#8b8ba3" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="815" y="395" font-size="13" fill="#c9c9d3" text-anchor="middle">runs, results</text>
<path d="M735 270 L895 330" fill="none" stroke="#8b8ba3" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="842" y="290" font-size="13" fill="#c9c9d3" text-anchor="middle">read / write</text>
<path d="M585 270 L585 330" fill="none" stroke="#8b8ba3" stroke-width="1.6" marker-end="url(#a)"/>
<text x="620" y="305" font-size="13" fill="#c9c9d3" text-anchor="middle">queues</text>
<path d="M1060 480 L1060 530 L165 530 L165 250" fill="none" stroke="#8b8ba3" stroke-width="1.6" marker-end="url(#a)"/>
<text x="612" y="522" font-size="13" fill="#c9c9d3" text-anchor="middle">Realtime (WebSockets): new messages and task progress</text>
<text x="40" y="575" font-size="13" fill="#6d6d80">Messages are written to Postgres first; Realtime tells clients to refetch through the API, so access control lives in one place.</text>
</svg>